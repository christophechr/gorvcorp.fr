server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex" always;
        return 200 "ok\n";
    }

    location = /index.html {
        # Redirect explicit requests, not the internal directory index lookup.
        if ($request_uri ~ "^/index\.html") {
            return 301 /$is_args$args;
        }
        add_header Cache-Control "no-cache" always;
    }

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|avif|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
